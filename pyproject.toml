[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "pyrlang-term"
version = "1.5a0"
requires-python = ">=3.10"
description = "Erlang term and External Term Format codec in Python and native Rust extension"
readme = "README.md"
authors = [
    {name = "Erlang Solutions Ltd and S2HC Sweden AB"},
    {email = "dmytro.lytovchenko@gmail.com"},
    {email = "pyrlang@s2hc.com"},
]

[project.urls]
Homepage = "https://github.com/Pyrlang/Term"

[project.optional-dependencies]
dev = ["pytest", "ty"]
docs = [
    "Jinja2>=2.10.1",
    "MarkupSafe>=1.0",
    "Pillow>=4.0.0",
    "Pygments>=2.2.0",
    "Sphinx>=1.6.2",
]

[tool.maturin]
bindings = "pyo3"
module-name = "term.native_codec_impl"
python-source = "."

[tool.pytest.ini_options]
testpaths = ["test"]
